name: repro 980

on:
  workflow_dispatch:
  push:
    branches: [triage-repros]

jobs:
  repro:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - working-directory: .github/triage-repros/980
        run: |
          set +e
          node --version
          npm i
          npx mocha --no-config --reporter ./reporter.js test.js
          echo "exit $?"
